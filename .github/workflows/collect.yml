# Morning candidate pull. Runs here (not in the Claude routine) because the routine's sandbox has no open internet.
# 13:23 UTC = 06:23 PDT / 05:23 PST, well before the routine fires at 16:00/17:00 UTC even if Actions cron runs late.
name: collect
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push-main
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect candidates (corpus overlap removed)
        run: HUB_DATE=$(TZ=America/Los_Angeles date +%F) python collect.py > candidates.json
      # Never blocks the commit below: if judging fails, unjudged candidates are committed and the routine still runs.
      - name: Judge candidates with TypeSafe (screen, score, semantic dedupe)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          pip install -q typesafe-sdk && python judge.py candidates candidates.json \
            || echo "::warning::TypeSafe judging failed; committing unjudged candidates"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          git commit -m "candidates: $(TZ=America/Los_Angeles date +%F)" || exit 0
          git pull --rebase && git push
