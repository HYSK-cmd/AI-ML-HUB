# Called by daily.yml after the brief is pushed (GITHUB_TOKEN pushes don't retrigger workflows); also runs on manual pushes. Render the news video for any day that doesn't have one yet, commit it, deploy Pages.
# Commits made here use GITHUB_TOKEN, which doesn't retrigger this workflow, so there's no loop.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: push-main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q edge-tts gTTS pillow
      - name: Check summaries against their sources (TypeSafe)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          pip install -q typesafe-sdk || { echo "::warning::typesafe-sdk install failed, skipping verify"; exit 0; }
          for f in data/2*.json; do
            [ -e "$f" ] || continue
            grep -q '"check"' "$f" || python judge.py verify "$f" || echo "::warning::verify failed for $f"
          done
      - name: Render missing videos
        run: |
          for f in data/2*.json; do
            [ -e "$f" ] || continue
            grep -q '"video"' "$f" && continue
            python make_video.py "$f" || python make_video.py "$f" || echo "::warning::video failed for $f"
          done
      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "publish: verify + video"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
