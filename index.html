<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB · AI/ML Daily</title>
<meta name="description" content="매일 아침 9시(PT), 대학생이 봐야 할 AI/ML 소식을 입문, 중급, 심화 하나씩 골라 한국어 요약과 뉴스 영상으로 전합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root {
  --bg: #fafaf9; --surface: #f2f2f0; --line: #e4e4e1; --text: #18181b; --muted: #5b5b61; --faint: #8a8a90;
  --accent: #c2410c; --accent-soft: #fbeee6; --on-accent: #fff7f2;
  --radius: 10px; --sans: "Pretendard Variable", Pretendard, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1a1a1d; --line: #2a2a2e; --text: #ececee; --muted: #a1a1a8; --faint: #72727a;
    --accent: #fb8a4c; --accent-soft: #2a1b13; --on-accent: #1a0d05; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --surface: #1a1a1d; --line: #2a2a2e; --text: #ececee; --muted: #a1a1a8; --faint: #72727a;
  --accent: #fb8a4c; --accent-soft: #2a1b13; --on-accent: #1a0d05; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

/* top bar */
header.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; height: 60px; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: -0.03em; text-decoration: none; display: flex; align-items: baseline; gap: 8px; }
.brand span { font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.datenav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid transparent; background: none; border-radius: var(--radius); font-size: 18px; transition: background .2s, transform .1s; }
.iconbtn:hover:not(:disabled) { background: var(--surface); }
.iconbtn:active:not(:disabled) { transform: scale(.96); }
.iconbtn:disabled { opacity: .3; cursor: default; }
select { font: 500 13px var(--mono); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); height: 36px; padding: 0 10px; }

/* layout */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 64px; }
aside { position: sticky; top: 60px; align-self: start; padding: 32px 0; max-height: calc(100dvh - 60px); overflow-y: auto; scrollbar-width: none; }
aside h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
aside section + section { margin-top: 32px; }
.cats { display: flex; flex-direction: column; gap: 2px; }
.cat { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: var(--radius); border: 1px solid transparent; background: none; text-align: left; font-size: 14px; color: var(--muted); transition: background .2s, color .2s; }
.cat:hover { background: var(--surface); color: var(--text); }
.cat[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.cat[aria-pressed="true"] .n { color: var(--accent); }
.cat.zero { opacity: .45; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: var(--radius); padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 0; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 12%, transparent); }
.clear { margin-top: 10px; border: 0; background: none; padding: 0; font-size: 13px; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
.clear:hover { color: var(--text); }
.archive { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.archive a { display: block; padding: 5px 10px; border-radius: var(--radius); text-decoration: none; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.archive a:hover { background: var(--surface); color: var(--text); }
.archive a[aria-current="true"] { color: var(--accent); font-weight: 500; }

main { padding: 40px 0 120px; min-width: 0; }
.dayhead { max-width: 760px; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
.dayhead time { display: block; color: var(--muted); }
.dayhead h1 { font-size: clamp(21px, 2.3vw, 27px); line-height: 1.5; letter-spacing: -0.025em; font-weight: 700; margin: 10px 0 0; text-wrap: balance; }
.stat { margin-top: 16px; color: var(--faint); }

/* items */
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 12px; padding: 32px 0; border-bottom: 1px solid var(--line); max-width: 820px; }
.rank { font-size: 14px; font-weight: 700; color: var(--accent); padding-top: 2px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); }
.meta .src { color: var(--text); font-weight: 500; }
.item h3 { font-size: 20px; line-height: 1.45; letter-spacing: -0.015em; font-weight: 650; margin: 8px 0 12px; }
.item h3 a { text-decoration: none; background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0 1.5px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .3s cubic-bezier(.16, 1, .3, 1); }
.item h3 a:hover { background-size: 100% 1.5px; }
.item h3 i { font-size: 15px; color: var(--faint); vertical-align: 1px; }
.summary { margin: 0; color: var(--text); max-width: 68ch; }
.why { margin: 16px 0 0; padding: 12px 16px; background: var(--surface); border-radius: var(--radius); color: var(--muted); font-size: 15px; max-width: 68ch; }
.why b { color: var(--accent); font-weight: 600; margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 6px; background: var(--surface); }
.tag.cat-tag { background: none; border: 1px solid var(--line); cursor: pointer; }
.tag.cat-tag:hover { border-color: var(--accent); color: var(--accent); }

/* daily news video */
.video { margin: 28px 0 4px; max-width: 820px; }
.video video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); background: #0d1a2e; }
.group { margin: 40px 0 0; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.group a { color: inherit; }

/* states */
.state { padding: 64px 0; max-width: 520px; color: var(--muted); }
.state h2 { color: var(--text); font-size: 20px; margin: 0 0 8px; }
.state button { margin-top: 16px; border: 0; background: var(--accent); color: var(--on-accent); padding: 9px 16px; border-radius: var(--radius); font-weight: 600; }
.state button:active { transform: scale(.98); }
.sk { background: var(--surface); border-radius: 6px; height: 14px; margin: 10px 0; }
.sk.h { height: 30px; width: 80%; }

footer { color: var(--faint); font-size: 13px; padding-top: 48px; }

@media (prefers-reduced-motion: no-preference) {
  .item { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .sk { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
}

/* mobile: filters become a horizontal strip above content */
@media (max-width: 900px) {
  .bar-in, .wrap { padding: 0 16px; }
  .brand span { display: none; }
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  aside { position: static; max-height: none; padding: 20px 0 0; overflow: visible; }
  aside section + section { margin-top: 16px; }
  aside h2, .archive-sec { display: none; }
  .cats { flex-direction: row; overflow-x: auto; scroll-snap-type: x proximity; gap: 6px; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .cat { flex: none; scroll-snap-align: start; border-color: var(--line); border-radius: 999px; padding: 6px 12px; }
  .seg { max-width: 320px; }
  main { padding-top: 28px; }
  .item { grid-template-columns: minmax(0, 1fr); }
  .rank { padding: 0 0 4px; }
  .item h3 { font-size: 18px; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./">HUB <span>AI/ML Daily</span></a>
    <nav class="datenav" aria-label="날짜 이동">
      <button class="iconbtn" id="prev" aria-label="이전 날짜"><i class="ph ph-caret-left"></i></button>
      <select id="datesel" aria-label="날짜 선택"></select>
      <button class="iconbtn" id="next" aria-label="다음 날짜"><i class="ph ph-caret-right"></i></button>
      <button class="iconbtn" id="theme" aria-label="테마 전환"><i class="ph ph-moon"></i></button>
    </nav>
  </div>
</header>

<div class="wrap">
  <aside>
    <section>
      <h2>카테고리</h2>
      <div class="cats" id="cats"></div>
      <button class="clear" id="clear" hidden>선택 해제</button>
    </section>
    <section>
      <h2>난이도</h2>
      <div class="seg" id="levels"></div>
    </section>
    <section class="archive-sec">
      <h2>지난 브리핑</h2>
      <ul class="archive" id="archive"></ul>
    </section>
  </aside>

  <main id="main" aria-live="polite">
    <div class="dayhead"><div class="sk" style="width:120px"></div><div class="sk h"></div><div class="sk h" style="width:55%"></div></div>
    <div class="item"><span></span><div><div class="sk" style="width:30%"></div><div class="sk h" style="width:70%"></div><div class="sk"></div><div class="sk"></div></div></div>
  </main>
</div>

<script>
const CATS = ["LLM", "Agents", "Multimodal & Vision", "Robotics & Embodied", "RL", "ML Systems & Infra", "Research Fundamentals", "Open Source & Tools", "Industry & Policy"];
const LEVELS = ["전체", "입문", "중급", "심화"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const safePath = p => /^videos\/[\w.-]+$/.test(p || "") ? p : "";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let dates = [], days = {}, current = null;
const state = { cats: new Set(store.get("hub.cats", [])), level: store.get("hub.level", "전체") };
const filtering = () => state.cats.size > 0 || state.level !== "전체";
const allItems = () => dates.flatMap(d => (days[d]?.items || []).map(it => ({ ...it, _date: d })));

// theme
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme i").className = "ph " + (dark ? "ph-sun" : "ph-moon");
}
applyTheme(store.get("hub.theme", null));
$("#theme").onclick = () => {
  const t = getComputedStyle(document.documentElement).colorScheme === "dark" ? "light" : "dark";
  store.set("hub.theme", t); applyTheme(t);
};

const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

function renderFilters() {
  const items = allItems();  // counts span the whole archive, filters do too
  $("#cats").innerHTML = CATS.map(c => {
    const n = items.filter(i => (i.categories || []).includes(c)).length;
    return `<button class="cat${n ? "" : " zero"}" aria-pressed="${state.cats.has(c)}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`;
  }).join("");
  $("#levels").innerHTML = LEVELS.map(l => `<button aria-pressed="${state.level === l}" data-level="${l}">${l}</button>`).join("");
  $("#clear").hidden = !filtering();
}

function toggleCat(c) {
  state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  store.set("hub.cats", [...state.cats]);
  render();
}
function resetFilters() {
  state.cats.clear(); state.level = "전체";
  store.set("hub.cats", []); store.set("hub.level", "전체");
  render();
}
$("#cats").onclick = e => { const b = e.target.closest("[data-cat]"); if (b) toggleCat(b.dataset.cat); };
$("#levels").onclick = e => {
  const b = e.target.closest("[data-level]"); if (!b) return;
  state.level = b.dataset.level; store.set("hub.level", state.level); render();
};
$("#clear").onclick = resetFilters;
$("#main").onclick = e => {
  const t = e.target.closest("[data-cat]"); if (t) { toggleCat(t.dataset.cat); return; }
  if (e.target.closest("#reset")) resetFilters();
};

function itemHTML(it, i) {
  return `<li class="item" style="--i:${i}">
    <span class="rank">${esc(it.level || "")}</span>
    <article>
      <div class="meta mono"><span class="src">${esc(it.source)}</span></div>
      <h3><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(it.title)} <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a></h3>
      <p class="summary">${esc(it.summary)}</p>
      ${it.why ? `<p class="why"><b>왜 봐야 하나</b>${esc(it.why)}</p>` : ""}
      <div class="tags">
        ${(it.categories || []).map(c => `<button class="tag cat-tag" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
        ${(it.keywords || []).map(k => `<span class="tag">${esc(k)}</span>`).join("")}
      </div>
    </article>
  </li>`;
}

const FOOTER = `<footer>매일 오전 9시(PT) 업데이트. arXiv, Hugging Face, Hacker News, Reddit, GitHub, AI 랩 블로그에서 수집하고 Claude가 입문, 중급, 심화 하나씩 골라 요약합니다. 요약은 틀릴 수 있으니 중요한 내용은 원문을 확인하세요.</footer>`;

function renderDay() {
  const day = days[current];
  const video = safePath(day.video);
  $("#main").innerHTML = `
    <div class="dayhead">
      <time class="mono" datetime="${esc(day.date)}">${esc(fmtDate(day.date))}</time>
      <h1>${esc(day.headline)}</h1>
      ${video ? `<div class="video"><video controls preload="metadata" playsinline poster="${esc(video.replace(/\.mp4$/, ".jpg"))}" src="${esc(video)}" aria-label="${esc(day.date)} AI 뉴스 브리핑 영상"></video></div>` : ""}
    </div>
    <ol class="items">${day.items.map(itemHTML).join("")}</ol>
    ${FOOTER}`;
}

function renderFiltered() {
  const shown = allItems().filter(it =>
    (!state.cats.size || (it.categories || []).some(c => state.cats.has(c))) &&
    (state.level === "전체" || it.level === state.level));
  const label = [...state.cats, state.level !== "전체" ? state.level : ""].filter(Boolean).join(", ");
  let html = "", last = null;
  shown.forEach((it, i) => {
    if (it._date !== last) {
      html += `${last ? "</ol>" : ""}<p class="group"><a href="#${it._date}">${esc(fmtDate(it._date))}</a></p><ol class="items">`;
      last = it._date;
    }
    html += itemHTML(it, i);
  });
  $("#main").innerHTML = `
    <div class="dayhead">
      <time class="mono">전체 아카이브에서 찾기</time>
      <h1>${esc(label)}</h1>
      <div class="stat mono">${dates.length}일 동안 ${shown.length}개</div>
    </div>
    ${shown.length ? html + "</ol>"
      : `<div class="state"><h2>조건에 맞는 항목이 없어요</h2><p>아직 이 카테고리나 난이도의 글이 올라오지 않았습니다. 필터를 바꾸거나 초기화해 보세요.</p><button id="reset">필터 초기화</button></div>`}
    ${FOOTER}`;
}

function render() {
  renderFilters();
  renderNav();
  if (!current) return;
  filtering() ? renderFiltered() : renderDay();
}

function renderNav() {
  const i = dates.indexOf(current);
  $("#datesel").innerHTML = dates.map(d => `<option value="${d}"${d === current ? " selected" : ""}>${d}</option>`).join("");
  $("#prev").disabled = i < 0 || i >= dates.length - 1;
  $("#next").disabled = i <= 0;
  $("#archive").innerHTML = dates.slice(0, 30).map(d => `<li><a href="#${d}"${d === current ? ' aria-current="true"' : ""}>${d}</a></li>`).join("");
}

function showError(title, msg) {
  $("#main").innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${esc(msg)}</p><button onclick="location.reload()">다시 시도</button></div>`;
}

// Picking a date means "show me that day", so it drops any active filter.
function route() {
  const want = location.hash.slice(1);
  current = dates.includes(want) ? want : dates[0];
  if (want && dates.includes(want) && filtering()) { state.cats.clear(); state.level = "전체"; store.set("hub.cats", []); store.set("hub.level", "전체"); }
  render(); window.scrollTo({ top: 0 });
}
$("#datesel").onchange = e => { location.hash = e.target.value; };
$("#prev").onclick = () => { location.hash = dates[dates.indexOf(current) + 1]; };
$("#next").onclick = () => { location.hash = dates[dates.indexOf(current) - 1]; };
addEventListener("hashchange", route);
// clicking a link to the date already in the URL fires no hashchange, but should still leave filter view
document.addEventListener("click", e => { const a = e.target.closest('a[href^="#"]'); if (a && a.getAttribute("href") === location.hash) route(); });

const getJSON = url => fetch(url, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

(async () => {
  try {
    dates = [...await getJSON("data/index.json")].sort().reverse();
  } catch {
    return showError("목록을 불러오지 못했어요", "data/index.json을 읽을 수 없습니다. 로컬에서 보고 있다면 python -m http.server로 열어주세요.");
  }
  if (!dates.length) return showError("아직 브리핑이 없어요", "첫 브리핑은 다음 오전 9시(PT)에 올라옵니다.");
  // ponytail: loads every day file up front (3 items each) so filters span the archive; switch to one combined feed.json past ~300 days
  const loaded = await Promise.allSettled(dates.map(d => getJSON(`data/${d}.json`)));
  loaded.forEach((r, i) => { if (r.status === "fulfilled") days[dates[i]] = { ...r.value, items: r.value.items || [] }; });
  dates = dates.filter(d => days[d]);
  if (!dates.length) return showError("브리핑을 불러오지 못했어요", "데이터를 가져오는 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.");
  route();
})();
</script>
</body>
</html>
